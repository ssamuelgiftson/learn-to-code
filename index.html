<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab - Learn to Code</title>
    <style>
        :root { --transition-speed: 0.3s; }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-tertiary: #1a1a2e;
            --bg-card: #12122a;
            --bg-code: #0d0d1a;
            --text-primary: #e0e0e0;
            --text-secondary: #aaa;
            --text-muted: #666;
            --border-color: #1e1e3a;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-gold: #ffd700;
            --accent-green: #4caf50;
            --accent-red: #f44336;
            --shadow: rgba(0,0,0,0.3);
            --header-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --quiz-option-bg: #1e1e3a;
            --quiz-option-border: #2a2a4a;
            --topic-btn-bg: #1e1e3a;
            --topic-btn-color: #bbb;
            --output-bg: #0a2a0a;
            --output-border: #1a4a1a;
            --output-color: #4caf50;
            --tip-bg: #1a1a0a;
            --how-bg: #0a1a2a;
            --practice-bg: #1a0a2a;
            --practice-border: #2a1a4a;
            --timer-bg: #2a1a0a;
        }

        [data-theme="light"] {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #eef1f5;
            --bg-card: #ffffff;
            --bg-code: #f8f9fc;
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --text-muted: #a0aec0;
            --border-color: #e2e8f0;
            --accent-primary: #5a67d8;
            --accent-secondary: #6b46c1;
            --accent-gold: #d69e2e;
            --accent-green: #38a169;
            --accent-red: #e53e3e;
            --shadow: rgba(0,0,0,0.1);
            --header-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --quiz-option-bg: #eef1f5;
            --quiz-option-border: #e2e8f0;
            --topic-btn-bg: #eef1f5;
            --topic-btn-color: #4a5568;
            --output-bg: #f0fff4;
            --output-border: #c6f6d5;
            --output-color: #276749;
            --tip-bg: #fffff0;
            --how-bg: #ebf8ff;
            --practice-bg: #faf5ff;
            --practice-border: #e9d8fd;
            --timer-bg: #fffaf0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background var(--transition-speed), color var(--transition-speed);
        }

        header {
            background: var(--header-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(102,126,234,0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo { font-size: 24px; font-weight: bold; color: white; }
        .logo span { color: #ffd700; }
        .header-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        nav { display: flex; gap: 5px; flex-wrap: wrap; }
        nav a {
            color: white; text-decoration: none; font-size: 13px;
            padding: 6px 12px; border-radius: 6px; transition: background 0.3s;
        }
        nav a:hover { background: rgba(255,255,255,0.15); }
        nav a.active-nav { background: rgba(255,255,255,0.25); }

        .theme-toggle { display: flex; align-items: center; gap: 6px; color: white; font-size: 14px; }
        .toggle-switch { position: relative; width: 48px; height: 24px; cursor: pointer; }
        .toggle-switch input { display: none; }
        .toggle-slider {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.3); border-radius: 24px; transition: 0.3s;
        }
        .toggle-slider::before {
            content: ""; position: absolute; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: rgba(255,215,0,0.5); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(24px); }

        .hero {
            text-align: center; padding: 40px 20px 25px;
            background: var(--bg-tertiary); transition: background var(--transition-speed);
        }
        .hero h1 { font-size: 32px; margin-bottom: 8px; color: var(--accent-primary); }
        .hero p { font-size: 15px; color: var(--text-secondary); max-width: 600px; margin: 0 auto; }

        .language-selector {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 8px; padding: 20px; max-width: 900px; margin: 0 auto;
        }
        .lang-btn {
            padding: 9px 20px; border: 2px solid var(--border-color);
            background: var(--bg-secondary); color: var(--text-primary);
            border-radius: 50px; cursor: pointer; font-size: 13px;
            font-weight: 600; transition: all 0.3s ease;
        }
        .lang-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); transform: translateY(-2px); }
        .lang-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent; color: white;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }

        .content-area { max-width: 1000px; margin: 0 auto; padding: 20px; }

        .progress-container {
            background: var(--bg-secondary); border-radius: 10px;
            padding: 16px; margin-bottom: 18px; border: 1px solid var(--border-color);
        }
        .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .progress-header h4 { color: var(--text-secondary); font-size: 13px; }
        .progress-stats { font-size: 12px; color: var(--accent-primary); }
        .progress-bar { height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px; transition: width 0.5s ease;
        }

        .topic-nav {
            display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px;
            padding: 12px; background: var(--bg-secondary);
            border-radius: 12px; border: 1px solid var(--border-color);
        }
        .topic-btn {
            padding: 7px 14px; background: var(--topic-btn-bg);
            color: var(--topic-btn-color); border: 1px solid var(--border-color);
            border-radius: 8px; cursor: pointer; font-size: 12px; transition: all 0.3s;
        }
        .topic-btn:hover:not(.locked) { background: var(--accent-primary); color: white; }
        .topic-btn.active { background: var(--accent-primary); color: white; border-color: var(--accent-primary); }
        .topic-btn.completed { border-color: var(--accent-green); color: var(--accent-green); }
        .topic-btn.completed::after { content: " ✅"; font-size: 10px; }
        .topic-btn.locked { opacity: 0.4; cursor: not-allowed; }
        .topic-btn.locked::after { content: " 🔒"; font-size: 10px; }

        .lesson-card {
            background: var(--bg-card); border-radius: 16px; padding: 28px;
            margin-bottom: 18px; border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px var(--shadow);
        }
        .lesson-card h2 { color: var(--accent-primary); margin-bottom: 5px; font-size: 22px; }
        .lesson-card .subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }
        .lesson-card h3 { color: var(--accent-gold); margin: 20px 0 8px; font-size: 16px; }
        .lesson-card p, .lesson-card li { line-height: 1.8; font-size: 14px; }
        .lesson-card ul { padding-left: 20px; margin: 6px 0; }
        .lesson-card li { margin-bottom: 3px; }

        .reading-timer {
            background: var(--timer-bg); border: 1px solid var(--accent-gold);
            border-radius: 10px; padding: 14px 18px; margin-bottom: 18px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .timer-text { font-size: 13px; color: var(--accent-gold); }
        .timer-countdown {
            font-size: 20px; font-weight: bold; color: var(--accent-gold);
            font-family: 'Courier New', monospace;
        }
        .timer-done { color: var(--accent-green) !important; }

        .concept-checklist {
            background: var(--bg-tertiary); border-radius: 10px;
            padding: 16px; margin: 16px 0; border: 1px solid var(--border-color);
        }
        .concept-checklist h4 { color: var(--accent-primary); margin-bottom: 10px; font-size: 14px; }
        .concept-item {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 0; font-size: 13px;
        }
        .concept-item input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: var(--accent-primary); cursor: pointer;
        }
        .concept-item.checked {
            color: var(--accent-green); text-decoration: line-through; opacity: 0.7;
        }

        .gate-quiz {
            background: var(--bg-secondary); border: 2px solid var(--accent-primary);
            border-radius: 12px; padding: 22px; margin: 18px 0;
        }
        .gate-quiz h3 { color: var(--accent-primary); margin-bottom: 4px; }
        .gate-quiz .gate-subtitle { color: var(--text-secondary); font-size: 12px; margin-bottom: 12px; }
        .gate-question { font-weight: bold; margin-bottom: 10px; font-size: 14px; white-space: pre-line; }
        .gate-option {
            display: block; padding: 10px 15px; margin: 5px 0;
            background: var(--quiz-option-bg); border: 1px solid var(--quiz-option-border);
            border-radius: 8px; cursor: pointer; transition: all 0.3s; font-size: 13px;
        }
        .gate-option:hover { border-color: var(--accent-primary); }
        .gate-option.correct { background: #1a3a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .gate-option.wrong { background: #3a1a1a; border-color: var(--accent-red); color: var(--accent-red); }
        .gate-result {
            margin-top: 10px; padding: 10px; border-radius: 8px;
            font-weight: bold; font-size: 13px;
        }
        .gate-result.success { background: #1a3a1a; color: var(--accent-green); border: 1px solid var(--accent-green); }
        .gate-result.failure { background: #3a1a1a; color: var(--accent-red); border: 1px solid var(--accent-red); }
        .unlock-btn {
            margin-top: 14px; padding: 11px 28px;
            background: linear-gradient(135deg, var(--accent-green), #2e7d32);
            color: white; border: none; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: bold; display: none;
        }
        .unlock-btn:hover { transform: scale(1.05); }

        .code-container { position: relative; margin: 10px 0; }
        .code-block {
            background: var(--bg-code); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 16px; overflow-x: auto;
            font-family: 'Courier New', monospace; font-size: 13px;
            line-height: 1.7; color: #e0e0e0;
        }
        .code-block .keyword { color: #c792ea; font-weight: bold; }
        .code-block .string { color: #c3e88d; }
        .code-block .comment { color: #546e7a; font-style: italic; }
        .code-block .function { color: #82aaff; }
        .code-block .number { color: #f78c6c; }
        .code-block .type { color: #ffcb6b; }
        .code-block .operator { color: #89ddff; }
        .copy-btn {
            position: absolute; top: 8px; right: 8px;
            background: var(--accent-primary); color: white; border: none;
            padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;
        }
        .copy-btn:hover { background: var(--accent-secondary); }

        .output-box {
            background: var(--output-bg); border: 1px solid var(--output-border);
            border-radius: 8px; padding: 12px 16px; margin: 8px 0;
            font-family: 'Courier New', monospace; font-size: 13px; color: var(--output-color);
        }
        .output-box::before {
            content: "▶ Output:"; display: block; font-weight: bold;
            margin-bottom: 5px; font-size: 11px; opacity: 0.7;
        }

        .tip-box {
            background: var(--tip-bg); border-left: 4px solid var(--accent-gold);
            padding: 11px 16px; margin: 10px 0; border-radius: 0 8px 8px 0; font-size: 13px;
        }
        .tip-box::before { content: "💡 Tip: "; font-weight: bold; color: var(--accent-gold); }
        .how-it-works {
            background: var(--how-bg); border-left: 4px solid var(--accent-primary);
            padding: 11px 16px; margin: 10px 0; border-radius: 0 8px 8px 0; font-size: 13px;
        }
        .how-it-works::before { content: "⚙️ How It Works: "; font-weight: bold; color: var(--accent-primary); }

        /* ===== COMPLETELY REBUILT EDITOR — SINGLE LAYER ===== */
        .practice-section {
            background: var(--practice-bg); border: 1px solid var(--practice-border);
            border-radius: 12px; padding: 22px; margin: 18px 0;
        }
        .practice-section h3 { color: var(--accent-secondary); margin-bottom: 10px; }

        .editor-box {
            border-radius: 10px; overflow: hidden;
            border: 2px solid var(--border-color); transition: border-color 0.3s;
        }
        .editor-box:focus-within { border-color: var(--accent-primary); }

        .editor-top {
            background: #1a1a2e; padding: 8px 14px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2a2a4a;
        }
        .dots { display: flex; gap: 6px; }
        .dots span { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot-r { background: #ff5f56; }
        .dot-y { background: #ffbd2e; }
        .dot-g { background: #27ca40; }
        .editor-label { color: #888; font-size: 12px; }

        /* THE ACTUAL CODE INPUT — SINGLE ELEMENT, NO OVERLAY */
        #codeInput {
            display: block;
            width: 100%;
            min-height: 220px;
            max-height: 500px;
            background: #0d0d1a;
            color: #e0e0e0;
            border: none;
            padding: 16px;
            font-family: 'Courier New', Consolas, 'Liberation Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            tab-size: 4;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: auto;
            outline: none;
            caret-color: #ffd700;
        }

        .editor-bottom {
            background: #1a1a2e; padding: 8px 14px;
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid #2a2a4a;
        }
        .char-info { color: #555; font-size: 11px; }
        .btn-row { display: flex; gap: 8px; }

        .run-btn {
            padding: 8px 22px;
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white; border: none; border-radius: 6px;
            cursor: pointer; font-size: 13px; font-weight: bold;
        }
        .run-btn:hover { transform: scale(1.05); }
        .clr-btn {
            padding: 8px 14px; background: #333; color: #aaa;
            border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .clr-btn:hover { background: #444; color: white; }

        .run-output {
            margin-top: 12px; padding: 14px;
            background: var(--output-bg); border: 1px solid var(--output-border);
            border-radius: 8px; font-family: 'Courier New', monospace;
            font-size: 13px; color: var(--output-color);
            min-height: 50px; white-space: pre-wrap;
        }
        .run-output.err {
            background: #2a0a0a; border-color: #4a1a1a; color: var(--accent-red);
        }

        .challenge-card {
            background: var(--bg-tertiary); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 16px; margin: 8px 0;
        }
        .challenge-card h4 { color: var(--accent-secondary); margin-bottom: 6px; font-size: 14px; }
        .challenge-card p { font-size: 13px; color: var(--text-secondary); }
        .challenge-card code {
            background: #0d0d1a; padding: 2px 6px; border-radius: 4px;
            color: #c3e88d; font-size: 12px;
        }
        .diff { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; margin-bottom: 6px; }
        .diff-e { background: #1a3a1a; color: #4caf50; }
        .diff-m { background: #3a3a1a; color: #ff9800; }
        .diff-h { background: #3a1a1a; color: #f44336; }

        .quiz-section {
            background: var(--bg-card); border: 2px solid var(--accent-primary);
            border-radius: 12px; padding: 22px; margin: 18px 0;
        }
        .quiz-section h3 { color: var(--accent-primary); margin-bottom: 12px; }
        .quiz-qb { margin: 16px 0; padding: 14px; background: var(--bg-tertiary); border-radius: 10px; }
        .quiz-qb p { font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        .quiz-opt {
            display: block; padding: 9px 14px; margin: 5px 0;
            background: var(--quiz-option-bg); border: 1px solid var(--quiz-option-border);
            border-radius: 8px; cursor: pointer; transition: all 0.3s; font-size: 13px;
        }
        .quiz-opt:hover { border-color: var(--accent-primary); }
        .quiz-opt.correct { background: #1a3a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .quiz-opt.wrong { background: #3a1a1a; border-color: var(--accent-red); color: var(--accent-red); }
        .quiz-res { margin-top: 8px; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 13px; display: none; }
        .score-box {
            text-align: center; margin-top: 18px; padding: 18px;
            background: var(--bg-tertiary); border-radius: 10px; display: none;
        }
        .score-box h2 { color: var(--accent-primary); }

        .toast {
            position: fixed; bottom: 25px; right: 25px; padding: 14px 22px;
            border-radius: 10px; color: white; font-weight: bold; font-size: 13px;
            z-index: 9999; transform: translateY(100px); opacity: 0; transition: all 0.4s ease;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: linear-gradient(135deg, #4caf50, #2e7d32); }
        .toast.error { background: linear-gradient(135deg, #f44336, #c62828); }
        .toast.info { background: linear-gradient(135deg, #667eea, #764ba2); }

        footer {
            text-align: center; padding: 22px; color: var(--text-muted);
            border-top: 1px solid var(--border-color); margin-top: 35px; font-size: 12px;
        }

        @media (max-width: 768px) {
            header { padding: 12px 15px; }
            .hero h1 { font-size: 22px; }
            .lesson-card { padding: 16px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">&lt;Code<span>Lab</span>/&gt;</div>
    <div class="header-right">
        <nav>
            <a href="#" class="active-nav" onclick="showSection('lessons',this)">📚 Lessons</a>
            <a href="#" onclick="showSection('practice',this)">✍️ Practice</a>
            <a href="#" onclick="showSection('quiz',this)">🧠 Quiz</a>
        </nav>
        <div class="theme-toggle">
            <span>🌙</span>
            <label class="toggle-switch">
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                <span class="toggle-slider"></span>
            </label>
            <span>☀️</span>
        </div>
    </div>
</header>

<div class="hero">
    <h1>🚀 Learn to Code, Step by Step</h1>
    <p>Choose a language, read carefully, prove your understanding, and unlock the next topic!</p>
</div>

<div class="language-selector">
    <button class="lang-btn active" onclick="switchLanguage('python',this)">🐍 Python</button>
    <button class="lang-btn" onclick="switchLanguage('javascript',this)">⚡ JavaScript</button>
    <button class="lang-btn" onclick="switchLanguage('java',this)">☕ Java</button>
    <button class="lang-btn" onclick="switchLanguage('c',this)">⚙️ C</button>
    <button class="lang-btn" onclick="switchLanguage('html',this)">🌐 HTML & CSS</button>
</div>

<div class="content-area">
    <div class="progress-container">
        <div class="progress-header">
            <h4>📊 Progress in <span id="progressLang">Python</span></h4>
            <span class="progress-stats" id="progressStats">0 / 0 completed</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="topic-nav" id="topicNav"></div>
    <div id="lessonContent"></div>
    <div id="practiceSection" style="display:none"></div>
    <div id="quizSection" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>
<footer><p>Built with ❤️ by Samuel Giftson | Keep Learning, Keep Growing! 🌱</p></footer>

<script>
// ==================== STATE ====================
var currentLang = 'python';
var currentTopic = 0;
var activeTimers = {};
var completionState = {};
var highlightTimer = null;

function getState(lang, topic) {
    var k = lang + '_' + topic;
    if (!completionState[k]) completionState[k] = { timerDone:false, conceptsChecked:false, quizPassed:false, completed:false };
    return completionState[k];
}

// ==================== LESSONS DATA ====================
var lessons = {
    python: {
        name:"Python", icon:"🐍",
        topics: [
            {
                title:"Introduction to Python", readTime:45,
                concepts:["I understand Python is a programming language","I know print() displays output","I understand code runs top to bottom","I know # starts a comment"],
                gateQuiz:{question:"What does print() do in Python?",options:["Sends to printer","Displays output on screen","Creates a variable","Deletes code"],correct:1,explanation:"print() displays text/values on the screen."},

// ==================== THEME ====================
function toggleTheme() {
    var t = document.getElementById('themeToggle');
    document.documentElement.setAttribute('data-theme', t.checked ? 'light' : 'dark');
    localStorage.setItem('theme', t.checked ? 'light' : 'dark');
}
(function(){
    if(localStorage.getItem('theme')==='light'){
        document.documentElement.setAttribute('data-theme','light');
        document.getElementById('themeToggle').checked=true;
    }
})();

// ==================== TOAST ====================
function showToast(msg,type){
    var t=document.getElementById('toast');
    t.textContent=msg;t.className='toast '+(type||'info')+' show';
    setTimeout(function(){t.classList.remove('show');},3500);
}

// ==================== NAV ====================
function switchLanguage(lang,btn){
    currentLang=lang;currentTopic=0;
    document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    document.getElementById('progressLang').textContent=lessons[lang].name;
    renderTopicNav();renderLesson();updateProgress();
    showSection('lessons',document.querySelector('nav a'));
}

function renderTopicNav(){
    var nav=document.getElementById('topicNav');
    var topics=lessons[currentLang].topics;
    nav.innerHTML=topics.map(function(t,i){
        var state=getState(currentLang,i);var cls='';
        if(i===currentTopic)cls='active';
        else if(state.completed)cls='completed';
        else if(i>0&&!getState(currentLang,i-1).completed)cls='locked';
        return '<button class="topic-btn '+cls+'" onclick="selectTopic('+i+')">'+(i+1)+'. '+t.title+'</button>';
    }).join('');
}

function selectTopic(i){
    if(i>0&&!getState(currentLang,i-1).completed){showToast('🔒 Complete previous topic first!','error');return;}
    currentTopic=i;renderTopicNav();renderLesson();
}

function updateProgress(){
    var topics=lessons[currentLang].topics;var done=0;
    topics.forEach(function(_,i){if(getState(currentLang,i).completed)done++;});
    var pct=Math.round((done/topics.length)*100);
    document.getElementById('progressFill').style.width=pct+'%';
    document.getElementById('progressStats').textContent=done+' / '+topics.length+' completed ('+pct+'%)';
}

// ==================== TIMER ====================
function startReadingTimer(secs){
    var state=getState(currentLang,currentTopic);
    var cd=document.getElementById('timerCountdown');
    var tx=document.getElementById('timerText');
    if(!cd||!tx)return;
    if(state.timerDone){cd.textContent='✅ Done!';cd.classList.add('timer-done');tx.textContent='✅ Reading time complete!';return;}
    var remaining=secs;var key=currentLang+'_'+currentTopic;
    if(activeTimers[key])clearInterval(activeTimers[key]);
    function upd(){var m=Math.floor(remaining/60);var s=remaining%60;cd.textContent=m+':'+(s<10?'0':'')+s;}
    upd();
    activeTimers[key]=setInterval(function(){
        remaining--;upd();
        if(remaining<=0){clearInterval(activeTimers[key]);state.timerDone=true;
            cd.textContent='✅ Done!';cd.classList.add('timer-done');
            tx.textContent='✅ Reading time complete!';
            checkCompletion();showToast('⏱️ Reading done! Check concepts below.','success');}
    },1000);
}

// ==================== CONCEPTS ====================
function onConceptCheck(){
    var cbs=document.querySelectorAll('.concept-cb');var all=true;
    cbs.forEach(function(cb){var item=cb.closest('.concept-item');
        if(cb.checked)item.classList.add('checked');else{item.classList.remove('checked');all=false;}});
    getState(currentLang,currentTopic).conceptsChecked=all;
    if(all)showToast('✅ All concepts checked! Pass the quiz.','success');
    checkCompletion();
}

// ==================== GATE QUIZ ====================
function checkGateAnswer(btn,idx){
    var topic=lessons[currentLang].topics[currentTopic];var correct=topic.gateQuiz.correct;
    var state=getState(currentLang,currentTopic);
    var opts=document.querySelectorAll('.gate-option');var res=document.getElementById('gateResult');
    opts.forEach(function(o,i){o.style.pointerEvents='none';if(i===correct)o.classList.add('correct');});
    if(idx===correct){btn.classList.add('correct');res.innerHTML='✅ Correct! '+topic.gateQuiz.explanation;res.className='gate-result success';state.quizPassed=true;checkCompletion();}
    else{btn.classList.add('wrong');res.innerHTML='❌ Wrong. '+topic.gateQuiz.explanation;res.className='gate-result failure';
        setTimeout(function(){opts.forEach(function(o){o.classList.remove('correct','wrong');o.style.pointerEvents='auto';});res.style.display='none';},3000);}
    res.style.display='block';
}

function checkCompletion(){
    var state=getState(currentLang,currentTopic);
    if(state.timerDone&&state.conceptsChecked&&state.quizPassed&&!state.completed){
        state.completed=true;var btn=document.getElementById('unlockBtn');
        if(btn)btn.style.display='inline-block';

// ====================================================
//  DIRECT HIGHLIGHTING — COLORS THE ACTUAL TEXT
//  Uses a hidden div to render, then replaces textarea
//  with a styled contenteditable when user stops typing
// ====================================================
function applyDirectHighlight(){
    var input = document.getElementById('codeInput');
    if(!input) return;

    var code = input.value;
    if(!code.trim()) return;

    // Save cursor position
    var selStart = input.selectionStart;
    var selEnd = input.selectionEnd;

    // Apply syntax color by swapping to a styled preview momentarily
    // Actually, for textareas we can't color individual characters
    // So we use the simple approach: color the background subtly based on content

    // For REAL per-character coloring, we need contenteditable
    // Let's convert to that approach properly:
    convertToContentEditable(code, selStart);
}

var isContentEditable = false;

function convertToContentEditable(code, cursorPos){
    if(isContentEditable) return; // already converted

    var textarea = document.getElementById('codeInput');
    if(!textarea) return;

    // Create a contenteditable div
    var div = document.createElement('div');
    div.id = 'codeInput';
    div.contentEditable = 'true';
    div.spellcheck = false;
    div.style.cssText = textarea.style.cssText;
    div.className = textarea.className;

    // Apply styles explicitly
    div.style.display = 'block';
    div.style.width = '100%';
    div.style.minHeight = '220px';
    div.style.maxHeight = '500px';
    div.style.background = '#0d0d1a';
    div.style.border = 'none';
    div.style.padding = '16px';
    div.style.fontFamily = "'Courier New', Consolas, 'Liberation Mono', monospace";
    div.style.fontSize = '14px';
    div.style.lineHeight = '1.6';
    div.style.overflowY = 'auto';
    div.style.outline = 'none';
    div.style.whiteSpace = 'pre-wrap';
    div.style.wordWrap = 'break-word';
    div.style.caretColor = '#ffd700';
    div.style.color = '#e0e0e0';
    div.style.tabSize = '4';

    // Set highlighted content
    div.innerHTML = colorize(code, currentLang);

    // Replace textarea with div
    textarea.parentNode.replaceChild(div, textarea);
    isContentEditable = true;

    // Restore cursor
    restoreCursor(div, cursorPos);

    // Attach input event for live highlighting
    div.addEventListener('input', function(){
        if(highlightTimer) clearTimeout(highlightTimer);
        var info = document.getElementById('charInfo');
        if(info) info.textContent = getTextContent(div).length + ' chars';

        highlightTimer = setTimeout(function(){
            var pos = saveCursor(div);
            var text = getTextContent(div);
            div.innerHTML = colorize(text, currentLang);
            restoreCursor(div, pos);
        }, 300);
    });

    // Handle paste — strip formatting
    div.addEventListener('paste', function(e){
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, text);
    });

    // Handle Tab key
    div.addEventListener('keydown', function(e){
        if(e.key === 'Tab'){
            e.preventDefault();
            document.execCommand('insertText', false, '    ');
        }
    });
}

function getTextContent(el){
    // Get text preserving newlines
    var html = el.innerHTML;
    // Replace <br> and <div> with newlines
    html = html.replace(/<br\s*\/?>/gi, '\n');
    html = html.replace(/<\/div><div>/gi, '\n');
    html = html.replace(/<div>/gi, '\n');
    html = html.replace(/<\/div>/gi, '');
    // Strip all remaining HTML tags
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || '';
}

function saveCursor(el){
    var sel = window.getSelection();
    if(!sel.rangeCount) return 0;
    var range = sel.getRangeAt(0);
    var preRange = range.cloneRange();
    preRange.selectNodeContents(el);
    preRange.setEnd(range.startContainer, range.startOffset);
    return preRange.toString().length;
}

function restoreCursor(el, pos){
    var sel = window.getSelection();
    var range = document.createRange();
    var charCount = 0;
    var found = false;

    function traverse(node){
        if(found) return;
        if(node.nodeType === 3){ // text node
            var len = node.textContent.length;
            if(charCount + len >= pos){
                range.setStart(node, pos - charCount);
                range.collapse(true);
                found = true;
            }
            charCount += len;
        } else {
            for(var i = 0; i < node.childNodes.length; i++){
                traverse(node.childNodes[i]);
                if(found) return;
            }
        }
    }

    traverse(el);
    if(!found){
        // Place cursor at end
        range.selectNodeContents(el);
        range.collapse(false);
    }
    sel.removeAllRanges();
    sel.addRange(range);
}

// ====================================================
//  COLORIZE — Returns HTML with colored spans
// ====================================================
function colorize(code, lang){
    var e = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // Process line by line to handle comments properly
    var lines = e.split('\n');
    var result = [];

    for(var li = 0; li < lines.length; li++){
        var line = lines[li];
        result.push(colorizeLine(line, lang));
    }

    return result.join('\n');
}

function colorizeLine(line, lang){
    if(lang === 'python'){
        // Check for comment
        var commentIdx = findCommentIndex(line, '#');
        if(commentIdx >= 0){
            var before = line.substring(0, commentIdx);
            var comment = line.substring(commentIdx);
            return colorizeParts(before, lang) + '<span style="color:#546e7a;font-style:italic">' + comment + '</span>';
        }
        return colorizeParts(line, lang);
    }
    else if(lang === 'javascript' || lang === 'java' || lang === 'c'){
        var commentIdx2 = findCommentIndex(line, '//');
        if(commentIdx2 >= 0){
            var before2 = line.substring(0, commentIdx2);
            var comment2 = line.substring(commentIdx2);
            return colorizeParts(before2, lang) + '<span style="color:#546e7a;font-style:italic">' + comment2 + '</span>';
        }
        return colorizeParts(line, lang);
    }
    else if(lang === 'html'){
        return colorizeHTML(line);
    }
    return line;
}

function findCommentIndex(line, marker){
    var inStr = false;
    var strChar = '';
    for(var i = 0; i < line.length; i++){
        var ch = line[i];
        if(!inStr && (ch === '"' || ch === "'")){
            inStr = true; strChar = ch;
        } else if(inStr && ch === strChar){
            inStr = false;
        } else if(!inStr){
            if(marker.length === 1 && ch === marker) return i;
            if(marker.length === 2 && line.substring(i, i+2) === marker) return i;
        }
    }
    return -1;
}

function colorizeParts(text, lang){
    // Tokenize the line
    var tokens = [];
    var i = 0;

    while(i < text.length){
        var ch = text[i];

        // String detection
        if(ch === '"' || ch === "'" || ch === '`'){
            var strStart = i;
            var quote = ch;
            i++;
            while(i < text.length && text[i] !== quote){
                if(text[i] === '\\') i++; // skip escaped
                i++;
            }
            if(i < text.length) i++; // skip closing quote
            tokens.push({type:'string', value: text.substring(strStart, i)});
            continue;
        }

        // Number detection
        if(ch >= '0' && ch <= '9'){
            var numStart = i;
            while(i < text.length && ((text[i] >= '0' && text[i] <= '9') || text[i] === '.')) i++;
            // Check it's not part of a word
            if(i < text.length && ((text[i] >= 'a' && text[i] <= 'z') || (text[i] >= 'A' && text[i] <= 'Z') || text[i] === '_')){
                // It's part of an identifier
                while(i < text.length && isWordChar(text[i])) i++;
                tokens.push({type:'plain', value: text.substring(numStart, i)});
            } else {
                tokens.push({type:'number', value: text.substring(numStart, i)});
            }
            continue;
        }

        // Word detection (identifiers/keywords)
        if(isWordChar(ch)){
            var wordStart = i;
            while(i < text.length && isWordChar(text[i])) i++;
            var word = text.substring(wordStart, i);
            var wordType = getWordType(word, lang);
            tokens.push({type: wordType, value: word});
            continue;
        }

        // Brackets
        if('()[]{}' .indexOf(ch) >= 0){
            tokens.push({type:'bracket', value: ch});
            i++;
            continue;
        }

        // Preprocessor for C
        if(ch === '#' && lang === 'c'){
            var ppStart = i;
            while(i < text.length && isWordChar(text[i+1])){i++;}
            i++;
            tokens.push({type:'keyword', value: text.substring(ppStart, i)});
            continue;
        }

        // Operators
        if('=+*/%!<>&|^~?:;,.-'.indexOf(ch) >= 0){
            // Check for =>
            if(ch === '=' && i+1 < text.length && text[i+1] === '&'){
                // escaped >
                if(text.substring(i, i+5) === '=&gt;'){
                    tokens.push({type:'operator', value:'=&gt;'});
                    i += 5;
                    continue;
                }
            }
            tokens.push({type:'operator', value: ch});
            i++;
            continue;
        }

        // Everything else
        tokens.push({type:'plain', value: ch});
        i++;
    }

    // Build colored HTML
    var html = '';
    for(var t = 0; t < tokens.length; t++){
        var tk = tokens[t];
        var color = getColor(tk.type);
        if(color){
            html += '<span style="color:'+color+(tk.type==='keyword'?';font-weight:bold':'')+'">' + tk.value + '</span>';
        } else {
            html += tk.value;
        }
    }
    return html;
}

function isWordChar(ch){
    return (ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z') || (ch >= '0' && ch <= '9') || ch === '_';
}

function getWordType(word, lang){
    var keywords = {
        python: ['def','return','if','elif','else','for','while','in','import','from','class','try','except','finally','with','as','lambda','pass','break','continue','and','or','not','is','True','False','None','global','yield','raise','del','assert'],
        javascript: ['const','let','var','function','return','if','else','for','while','do','switch','case','break','continue','class','new','this','typeof','instanceof','try','catch','finally','throw','import','export','default','async','await','of','in','true','false','null','undefined'],
        java: ['public','private','protected','static','void','class','new','return','if','else','for','while','do','switch','case','break','continue','try','catch','finally','throw','throws','import','package','extends','implements','interface','abstract','final','this','super','true','false','null'],
        c: ['int','float','double','char','void','long','short','unsigned','signed','return','if','else','for','while','do','switch','case','break','continue','struct','typedef','sizeof','const','static','extern','enum','auto','goto','default']
    };

    var functions = {
        python: ['print','input','range','len','type','int','str','float','bool','list','dict','set','tuple','abs','max','min','sum','sorted','enumerate','zip','map','filter','open','round'],
        javascript: ['console','log','alert','prompt','parseInt','parseFloat','Math','Array','Object','String','Number','JSON','document','window','setTimeout','setInterval','push','pop','map','filter','reduce','forEach','includes','indexOf'],
        java: ['System','out','println','print','Scanner','Math','Arrays','String','Integer','Double'],
        c: ['printf','scanf','main','malloc','free','strlen','strcpy','strcmp','sizeof','fopen','fclose','fprintf','fscanf']
    };

    var types = {
        python: [],
        javascript: [],
        java: ['int','double','float','char','boolean','String','long','short','byte'],
        c: []
    };

    if(types[lang] && types[lang].indexOf(word) >= 0) return 'type';
    if(keywords[lang] && keywords[lang].indexOf(word) >= 0) return 'keyword';
    if(functions[lang] && functions[lang].indexOf(word) >= 0) return 'function';
    return 'plain';
}

function colorizeHTML(line){
    var e = line;
    // Tags
    e = e.replace(/(&lt;\/?)([\w]+)/g, function(m, p1, p2){
        return p1 + '<span style="color:#f07178">' + p2 + '</span>';
    });
    // Attributes
    e = e.replace(/([\w-]+)(=)/g, function(m, p1, p2){
        return '<span style="color:#ffcb6b">' + p1 + '</span><span style="color:#89ddff">' + p2 + '</span>';
    });
    // Strings
    e = e.replace(/("(?:[^"\\]|\\.)*")/g, '<span style="color:#c3e88d">$1</span>');
    // CSS properties
    e = e.replace(/\b(color|background|padding|margin|border|font-size|display|flex|width|height|text-align|border-radius)\b/g,
        '<span style="color:#c792ea">$1</span>');
    return e;
}

function getColor(type){
    var colors = {
        keyword: '#c792ea',
        string: '#c3e88d',
        function: '#82aaff',
        number: '#f78c6c',
        bracket: '#ffd700',
        operator: '#89ddff',
        type: '#ffcb6b',
        comment: '#546e7a'
    };
    return colors[type] || null;
}

        return getTextContent(el);
    }

function runCode(){
    var code = getEditorCode();
    var output = document.getElementById('runOutput');
    if(!code.trim()){output.textContent='⚠️ Write some code first!';output.className='run-output err';return;}

    if(currentLang === 'javascript'){
        try {
            var results = [];
            var oLog = console.log; var oWarn = console.warn; var oErr = console.error;
            console.log = function(){results.push(Array.prototype.slice.call(arguments).map(function(a){return typeof a==='object'?JSON.stringify(a,null,2):String(a);}).join(' '));};
            console.warn = function(){results.push('⚠️ '+Array.prototype.slice.call(arguments).join(' '));};
            console.error = function(){results.push('❌ '+Array.prototype.slice.call(arguments).join(' '));};
            var ret = eval(code);
            console.log=oLog;console.warn=oWarn;console.error=oErr;
            if(results.length>0) output.textContent=results.join('\n');
            else if(ret!==undefined) output.textContent=String(ret);
            else output.textContent='✅ Code executed (no output).\nUse console.log() to see output!';
            output.className='run-output';
            showToast('✅ Code ran!','success');
        } catch(err){
            output.textContent='❌ Error: '+err.message+'\n\n💡 Check for typos!';
            output.className='run-output err';
            showToast('❌ Error in code','error');
        }
    } else if(currentLang === 'html'){
        try{
            var frame=document.createElement('iframe');frame.style.display='none';
            document.body.appendChild(frame);frame.contentDocument.open();
            frame.contentDocument.write(code);frame.contentDocument.close();
            var txt=frame.contentDocument.body.innerText||'';
            document.body.removeChild(frame);
            output.textContent=txt?'📄 Rendered:\n\n'+txt:'✅ HTML rendered';
            output.className='run-output';
        }catch(err){output.textContent='❌ Error: '+err.message;output.className='run-output err';}
    } else {
        output.textContent=simOutput(code,currentLang);output.className='run-output';
    }
}

function simOutput(code,lang){
    var outputs=[];var match;
    if(lang==='python'){
        var re=/print\s*\(([\s\S]*?)\)/g;
        while((match=re.exec(code))!==null){
            var arg=match[1].trim();var parts=splitArgs(arg);
            var resolved=parts.map(function(p){
                p=p.trim();
                if((p[0]==='"'&&p[p.length-1]==='"')||(p[0]==="'"&&p[p.length-1]==="'"))return p.slice(1,-1);
                try{var v=eval(p);if(v!==undefined)return String(v);}catch(e){}
                return p;
            });
            outputs.push(resolved.join(' '));
        }
        if(!outputs.length)return 'ℹ️ Python can\'t run in browser.\n🔧 Use replit.com or onlinegdb.com\n🔄 Switch to JavaScript for live execution!\n💡 If code has print(), I\'ll simulate output.';
        return '🐍 Simulated Output:\n\n'+outputs.join('\n');
    } else if(lang==='java'){
        var re2=/System\.out\.println\s*\(([\s\S]*?)\)/g;
        while((match=re2.exec(code))!==null)outputs.push(match[1].replace(/"/g,'').trim());
        if(!outputs.length)return 'ℹ️ Java needs a compiler.\n🔧 Use replit.com';
        return '☕ Simulated Output:\n\n'+outputs.join('\n');
    } else if(lang==='c'){
        var re3=/printf\s*\(\s*"((?:[^"\\]|\\.)*)"/g;
        while((match=re3.exec(code))!==null)outputs.push(match[1].replace(/\\n/g,'\n'));
        if(!outputs.length)return 'ℹ️ C needs a compiler.\n🔧 Use replit.com';
        return '⚙️ Simulated Output:\n\n'+outputs.join('');
    }
    return 'Switch to JavaScript for live execution!';
}

function splitArgs(str){
    var parts=[];var inStr=false;var strCh='';var cur='';
    for(var i=0;i<str.length;i++){
        var c=str[i];
        if(!inStr&&(c==='"'||c==="'")){inStr=true;strCh=c;cur+=c;}
        else if(inStr&&c===strCh){inStr=false;cur+=c;}
        else if(!inStr&&c===','){parts.push(cur.trim());cur='';}
        else{cur+=c;}
    }
    parts.push(cur.trim());
    return parts;
}

function renderQuiz(){
    var qd=lessons[currentLang].quiz;var ln=lessons[currentLang].name;
    if(!qd||!qd.length){document.getElementById('quizSection').innerHTML='<div class="lesson-card"><h2>Quiz coming soon!</h2></div>';return;}
    var html='<div class="quiz-section"><h3>🧠 '+ln+' Final Quiz</h3>';
    qd.forEach(function(q,qi){
        html+='<div class="quiz-qb"><p>'+(qi+1)+'. '+q.question+'</p>';
        q.options.forEach(function(opt,oi){html+='<div class="quiz-opt" onclick="checkQuiz(this,'+qi+','+oi+')">'+opt+'</div>';});
        html+='<div class="quiz-res" id="qr-'+qi+'"></div></div>';
    });
    html+='<div class="score-box" id="scoreBox"><h2 id="scoreText"></h2><p id="scoreMsg" style="margin-top:8px;color:var(--text-secondary)"></p></div></div>';
    document.getElementById('quizSection').innerHTML=html;window._qs=0;window._qa=0;
}

function checkQuiz(el,qi,oi){
    var qd=lessons[currentLang].quiz;var correct=qd[qi].correct;
    var res=document.getElementById('qr-'+qi);
    var opts=el.parentElement.querySelectorAll('.quiz-opt');
    opts.forEach(function(o,i){o.style.pointerEvents='none';if(i===correct)o.classList.add('correct');});
    if(oi===correct){el.classList.add('correct');res.textContent='✅ Correct!';res.style.color='var(--accent-green)';window._qs++;}
    else{el.classList.add('wrong');res.textContent='❌ Wrong — correct is green';res.style.color='var(--accent-red)';}
    res.style.display='block';window._qa++;
    if(window._qa===qd.length){
        var pct=Math.round((window._qs/qd.length)*100);
        document.getElementById('scoreText').textContent='Score: '+window._qs+'/'+qd.length+' ('+pct+'%)';
        document.getElementById('scoreMsg').textContent=pct>=80?'🎉 Excellent, Samuel!':pct>=60?'👍 Good! Review what you missed.':'📚 Keep studying!';
        document.getElementById('scoreBox').style.display='block';
    }
}

// ==================== UTILITY ====================
function copyCode(btn){
    var block=btn.nextElementSibling;
    navigator.clipboard.writeText(block.innerText).then(function(){
        btn.textContent='✅ Copied!';setTimeout(function(){btn.textContent='📋 Copy';},2000);
    });
}

renderTopicNav();renderLesson();updateProgress();
