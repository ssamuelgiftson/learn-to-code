<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab - Learn to Code</title>
    <meta name="description" content="Learn programming step by step - Python, JavaScript, HTML, CSS, Java, C, C#, Lua, TypeScript, GDScript">
    <meta name="author" content="Samuel Giftson">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">&lt;Code<span>Lab</span>/&gt;</div>
    <div class="header-right">
        <nav>
            <a href="#" class="active-nav" onclick="showSection('lessons',this)">📚 Lessons</a>
            <a href="#" onclick="showSection('practice',this)">✍️ Practice</a>
            <a href="#" onclick="showSection('quiz',this)">🧠 Quiz</a>
        </nav>
        <div class="theme-toggle">
            <span>🌙</span>
            <label class="toggle-switch">
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                <span class="toggle-slider"></span>
            </label>
            <span>☀️</span>
        </div>
    </div>
</header>

<div class="hero">
    <h1>🚀 Learn to Code, Step by Step</h1>
    <p>Choose a language, read carefully, prove your understanding, and unlock the next topic!</p>
</div>

<div class="language-selector">
    <button class="lang-btn active" onclick="switchLanguage('python',this)">🐍 Python</button>
    <button class="lang-btn" onclick="switchLanguage('javascript',this)">⚡ JavaScript</button>
    <button class="lang-btn" onclick="switchLanguage('html',this)">🌐 HTML & CSS</button>
    <button class="lang-btn" onclick="switchLanguage('css',this)">🎨 CSS Advanced</button>
    <button class="lang-btn" onclick="switchLanguage('typescript',this)">🔷 TypeScript</button>
    <button class="lang-btn" onclick="switchLanguage('java',this)">☕ Java</button>
    <button class="lang-btn" onclick="switchLanguage('c',this)">⚙️ C</button>
    <button class="lang-btn" onclick="switchLanguage('csharp',this)">💜 C#</button>
    <button class="lang-btn" onclick="switchLanguage('lua',this)">🌙 Lua</button>
    <button class="lang-btn" onclick="switchLanguage('gdscript',this)">🎮 GDScript</button>
</div>

<div class="content-area">
    <div class="progress-container">
        <div class="progress-header">
            <h4>📊 Progress in <span id="progressLang">Python</span></h4>
            <span class="progress-stats" id="progressStats">0 / 0 completed</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
    </div>

    <div class="topic-nav" id="topicNav"></div>

    <div id="lessonContent"></div>
    <div id="practiceSection" style="display:none"></div>
    <div id="quizSection" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<footer>
    <p>Built with ❤️ by Samuel Giftson | Keep Learning, Keep Growing! 🌱</p>
</footer>

<script src="script.js"></script>
</body>
</html>
