<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab - Learn to Code</title>
    <style>
        /* ===== CSS VARIABLES FOR THEMING ===== */
        :root {
            --transition-speed: 0.3s;
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-tertiary: #1a1a2e;
            --bg-card: #12122a;
            --bg-code: #0d0d1a;
            --bg-input: #0d0d1a;
            --text-primary: #e0e0e0;
            --text-secondary: #aaa;
            --text-muted: #666;
            --border-color: #1e1e3a;
            --border-hover: #667eea;
            --accent-primary: #667eea;
            --accent-secondary: #764ba2;
            --accent-gold: #ffd700;
            --accent-green: #4caf50;
            --accent-red: #f44336;
            --shadow: rgba(0, 0, 0, 0.3);
            --header-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --quiz-option-bg: #1e1e3a;
            --quiz-option-border: #2a2a4a;
            --topic-btn-bg: #1e1e3a;
            --topic-btn-color: #bbb;
            --output-bg: #0a2a0a;
            --output-border: #1a4a1a;
            --output-color: #4caf50;
            --tip-bg: #1a1a0a;
            --how-bg: #0a1a2a;
            --practice-bg: #1a0a2a;
            --practice-border: #2a1a4a;
            --locked-bg: #1a1a1a;
            --timer-bg: #2a1a0a;
        }

        [data-theme="light"] {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #eef1f5;
            --bg-card: #ffffff;
            --bg-code: #1e1e2e;
            --bg-input: #1e1e2e;
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --text-muted: #a0aec0;
            --border-color: #e2e8f0;
            --border-hover: #667eea;
            --accent-primary: #5a67d8;
            --accent-secondary: #6b46c1;
            --accent-gold: #d69e2e;
            --accent-green: #38a169;
            --accent-red: #e53e3e;
            --shadow: rgba(0, 0, 0, 0.1);
            --header-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --quiz-option-bg: #eef1f5;
            --quiz-option-border: #e2e8f0;
            --topic-btn-bg: #eef1f5;
            --topic-btn-color: #4a5568;
            --output-bg: #f0fff4;
            --output-border: #c6f6d5;
            --output-color: #276749;
            --tip-bg: #fffff0;
            --how-bg: #ebf8ff;
            --practice-bg: #faf5ff;
            --practice-border: #e9d8fd;
            --locked-bg: #f7fafc;
            --timer-bg: #fffaf0;
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background var(--transition-speed), color var(--transition-speed);
        }

        /* ===== HEADER ===== */
        header {
            background: var(--header-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .logo span { color: #ffd700; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
            padding: 5px 10px;
            border-radius: 5px;
        }

        nav a:hover { background: rgba(255,255,255,0.15); }
        nav a.active-nav { background: rgba(255,255,255,0.25); }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 13px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            cursor: pointer;
        }

        .toggle-switch input { display: none; }

        .toggle-slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 26px;
            transition: 0.3s;
        }

        .toggle-slider::before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background: rgba(255,215,0,0.5);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(24px);
        }

        /* ===== HERO SECTION ===== */
        .hero {
            text-align: center;
            padding: 50px 20px 30px;
            background: var(--bg-tertiary);
            transition: background var(--transition-speed);
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: var(--accent-primary);
        }

        .hero p {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* ===== LANGUAGE SELECTOR ===== */
        .language-selector {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 25px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .lang-btn {
            padding: 10px 24px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* ===== MAIN CONTENT ===== */
        .content-area {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-container {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            transition: background var(--transition-speed);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .progress-header h4 {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .progress-stats {
            font-size: 12px;
            color: var(--accent-primary);
        }

        .progress-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* ===== TOPIC NAVIGATION ===== */
        .topic-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .topic-btn {
            padding: 8px 16px;
            background: var(--topic-btn-bg);
            color: var(--topic-btn-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            position: relative;
        }

        .topic-btn:hover:not(.locked) {
            background: var(--accent-primary);
            color: white;
        }

        .topic-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .topic-btn.completed {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .topic-btn.completed::after {
            content: " ✅";
            font-size: 10px;
        }

        .topic-btn.locked {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .topic-btn.locked::after {
            content: " 🔒";
            font-size: 10px;
        }

        /* ===== LESSON CARD ===== */
        .lesson-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px var(--shadow);
            transition: background var(--transition-speed);
        }

        .lesson-card h2 {
            color: var(--accent-primary);
            margin-bottom: 6px;
            font-size: 24px;
        }

        .lesson-card .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 18px;
        }

        .lesson-card h3 {
            color: var(--accent-gold);
            margin: 22px 0 8px;
            font-size: 17px;
        }

        .lesson-card p, .lesson-card li {
            line-height: 1.8;
            font-size: 14px;
            color: var(--text-primary);
        }

        .lesson-card ul {
            padding-left: 22px;
            margin: 8px 0;
        }

        .lesson-card li { margin-bottom: 4px; }

        /* ===== READING TIMER ===== */
        .reading-timer {
            background: var(--timer-bg);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer-text {
            font-size: 14px;
            color: var(--accent-gold);
        }

        .timer-countdown {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-gold);
            font-family: 'Courier New', monospace;
        }

        .timer-done {
            color: var(--accent-green);
        }

        /* ===== CONCEPT CHECKBOXES ===== */
        .concept-checklist {
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 18px;
            margin: 18px 0;
            border: 1px solid var(--border-color);
        }

        .concept-checklist h4 {
            color: var(--accent-primary);
            margin-bottom: 12px;
            font-size: 15px;
        }

        .concept-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-size: 14px;
            color: var(--text-primary);
        }

        .concept-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        .concept-item.checked {
            color: var(--accent-green);
            text-decoration: line-through;
            opacity: 0.7;
        }

        /* ===== MINI QUIZ GATE ===== */
        .gate-quiz {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
        }

        .gate-quiz h3 {
            color: var(--accent-primary);
            margin-bottom: 5px;
        }

        .gate-quiz .gate-subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 15px;
        }

        .gate-question {
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-primary);
            font-size: 15px;
        }

        .gate-option {
            display: block;
            padding: 10px 16px;
            margin: 6px 0;
            background: var(--quiz-option-bg);
            border: 1px solid var(--quiz-option-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-primary);
            font-size: 14px;
        }

        .gate-option:hover { border-color: var(--accent-primary); }
        .gate-option.correct { background: #1a3a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .gate-option.wrong { background: #3a1a1a; border-color: var(--accent-red); color: var(--accent-red); }

        .gate-result {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .gate-result.success {
            background: #1a3a1a;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .gate-result.failure {
            background: #3a1a1a;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .unlock-btn {
            margin-top: 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--accent-green), #2e7d32);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: none;
        }

        .unlock-btn:hover { transform: scale(1.05); }

        /* ===== CODE BLOCK ===== */
        .code-container {
            position: relative;
            margin: 12px 0;
        }

        .code-block {
            background: var(--bg-code);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: #e0e0e0;
        }

        .code-block .keyword { color: #c792ea; font-weight: bold; }
        .code-block .string { color: #c3e88d; }
        .code-block .comment { color: #546e7a; font-style: italic; }
        .code-block .function { color: #82aaff; }
        .code-block .number { color: #f78c6c; }
        .code-block .type { color: #ffcb6b; }
        .code-block .operator { color: #89ddff; }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .copy-btn:hover { background: var(--accent-secondary); }

        /* ===== OUTPUT BOX ===== */
        .output-box {
            background: var(--output-bg);
            border: 1px solid var(--output-border);
            border-radius: 8px;
            padding: 12px 18px;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--output-color);
        }

        .output-box::before {
            content: "▶ Output:";
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 11px;
            opacity: 0.7;
        }

        /* ===== TIP & HOW IT WORKS ===== */
        .tip-box {
            background: var(--tip-bg);
            border-left: 4px solid var(--accent-gold);
            padding: 12px 18px;
            margin: 12px 0;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
        }

        .tip-box::before { content: "💡 Tip: "; font-weight: bold; color: var(--accent-gold); }

        .how-it-works {
            background: var(--how-bg);
            border-left: 4px solid var(--accent-primary);
            padding: 12px 18px;
            margin: 12px 0;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
        }

        .how-it-works::before { content: "⚙️ How It Works: "; font-weight: bold; color: var(--accent-primary); }

        /* ===== PRACTICE SECTION ===== */
        .practice-section {
            background: var(--practice-bg);
            border: 1px solid var(--practice-border);
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
        }

        .practice-section h3 {
            color: var(--accent-secondary);
            margin-bottom: 12px;
        }

        /* ===== SYNTAX HIGHLIGHTED EDITOR ===== */
        .editor-wrapper {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            transition: border-color 0.3s;
        }

        .editor-wrapper:focus-within {
            border-color: var(--accent-primary);
        }

        .editor-header {
            background: #1a1a2e;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a4a;
        }

        .editor-dots {
            display: flex;
            gap: 6px;
        }

        .editor-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27ca40; }

        .editor-lang {
            color: #888;
            font-size: 12px;
        }

        .editor-container {
            position: relative;
            min-height: 200px;
        }

        .code-editor {
            width: 100%;
            min-height: 200px;
            background: transparent;
            color: #e0e0e0;
            border: none;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            position: relative;
            z-index: 2;
            caret-color: #667eea;
        }

        .code-editor:focus { outline: none; }

        .syntax-highlight {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 200px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: transparent;
            pointer-events: none;
            z-index: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: hidden;
        }

        .syntax-highlight .sh-keyword { color: #c792ea; font-weight: bold; }
        .syntax-highlight .sh-string { color: #c3e88d; }
        .syntax-highlight .sh-comment { color: #546e7a; font-style: italic; }
        .syntax-highlight .sh-function { color: #82aaff; }
        .syntax-highlight .sh-number { color: #f78c6c; }
        .syntax-highlight .sh-operator { color: #89ddff; }
        .syntax-highlight .sh-bracket { color: #ffd700; }
        .syntax-highlight .sh-tag { color: #f07178; }
        .syntax-highlight .sh-attr { color: #ffcb6b; }
        .syntax-highlight .sh-plain { color: #e0e0e0; }

        .editor-footer {
            background: #1a1a2e;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2a2a4a;
        }

        .char-count {
            color: #555;
            font-size: 11px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .run-btn {
            padding: 8px 24px;
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .run-btn:hover { transform: scale(1.05); }

        .clear-btn {
            padding: 8px 16px;
            background: #333;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .clear-btn:hover { background: #444; color: white; }

        .practice-output {
            margin-top: 12px;
            padding: 15px;
            background: var(--output-bg);
            border: 1px solid var(--output-border);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--output-color);
            min-height: 50px;
            white-space: pre-wrap;
        }

        .practice-output.error-output {
            background: #2a0a0a;
            border-color: #4a1a1a;
            color: var(--accent-red);
        }

        /* ===== CHALLENGE CARDS ===== */
        .challenge-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            margin: 10px 0;
        }

        .challenge-card h4 {
            color: var(--accent-secondary);
            margin-bottom: 8px;
        }

        .challenge-card p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .difficulty {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .diff-easy { background: #1a3a1a; color: #4caf50; }
        .diff-medium { background: #3a3a1a; color: #ff9800; }
        .diff-hard { background: #3a1a1a; color: #f44336; }

        /* ===== QUIZ SECTION ===== */
        .quiz-section {
            background: var(--bg-card);
            border: 2px solid var(--accent-primary);
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
        }

        .quiz-section h3 { color: var(--accent-primary); margin-bottom: 15px; }

        .quiz-question-block {
            margin: 18px 0;
            padding: 15px;
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        .quiz-question-block p {
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .quiz-option {
            display: block;
            padding: 10px 16px;
            margin: 6px 0;
            background: var(--quiz-option-bg);
            border: 1px solid var(--quiz-option-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-primary);
            font-size: 14px;
        }

        .quiz-option:hover { border-color: var(--accent-primary); }
        .quiz-option.correct { background: #1a3a1a; border-color: var(--accent-green); color: var(--accent-green); }
        .quiz-option.wrong { background: #3a1a1a; border-color: var(--accent-red); color: var(--accent-red); }

        .quiz-result {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            display: none;
        }

        .score-display {
            text-align: center;
            margin-top: 20px;

    // =======================================
    //  THEME TOGGLE
    // =======================================
    function toggleTheme() {
        const html = document.documentElement;
        const toggle = document.getElementById('themeToggle');
        if (toggle.checked) {
            html.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
        } else {
            html.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    }

    // Load saved theme
    (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.getElementById('themeToggle').checked = true;
        }
    })();

    // =======================================
    //  TOAST NOTIFICATIONS
    // =======================================
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => { toast.classList.remove('show'); }, 3500);
    }

    // =======================================
    //  LANGUAGE SWITCHING
    // =======================================
    function switchLanguage(lang, btn) {
        currentLang = lang;
        currentTopic = 0;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('progressLang').textContent = lessons[lang].name;
        renderTopicNav();
        renderLesson();
        updateProgress();
        showSection('lessons', document.querySelector('nav a'));
    }

    // =======================================
    //  TOPIC NAVIGATION
    // =======================================
    function renderTopicNav() {
        const nav = document.getElementById('topicNav');
        const topics = lessons[currentLang].topics;
        nav.innerHTML = topics.map((t, i) => {
            const state = getState(currentLang, i);
            let cls = '';
            if (i === currentTopic) cls = 'active';
            else if (state.completed) cls = 'completed';
            else if (i > 0 && !getState(currentLang, i - 1).completed) cls = 'locked';
            return `<button class="topic-btn ${cls}" onclick="selectTopic(${i})">${i + 1}. ${t.title}</button>`;
        }).join('');
    }

    function selectTopic(index) {
        if (index > 0 && !getState(currentLang, index - 1).completed) {
            showToast('🔒 Complete the previous topic first!', 'error');
            return;
        }
        currentTopic = index;
        renderTopicNav();
        renderLesson();
    }

    // =======================================
    //  PROGRESS
    // =======================================
    function updateProgress() {
        const topics = lessons[currentLang].topics;
        let completed = 0;
        topics.forEach((_, i) => { if (getState(currentLang, i).completed) completed++; });
        const pct = Math.round((completed / topics.length) * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressStats').textContent = `${completed} / ${topics.length} topics completed (${pct}%)`;
    }

    // =======================================
    //  READING TIMER
    // =======================================
    function startReadingTimer(seconds) {
        const state = getState(currentLang, currentTopic);
        if (state.timerDone) {
            document.getElementById('timerCountdown').textContent = '✅ Done!';
            document.getElementById('timerCountdown').classList.add('timer-done');
            document.getElementById('timerText').textContent = '✅ You\'ve spent enough time reading!';
            return;
        }

        let remaining = seconds;
        const timerKey = `${currentLang}_${currentTopic}`;

        if (timers[timerKey]) clearInterval(timers[timerKey]);

        updateTimerDisplay(remaining);

        timers[timerKey] = setInterval(() => {
            remaining--;
            updateTimerDisplay(remaining);
            if (remaining <= 0) {
                clearInterval(timers[timerKey]);
                state.timerDone = true;
                document.getElementById('timerCountdown').textContent = '✅ Done!';
                document.getElementById('timerCountdown').classList.add('timer-done');
                document.getElementById('timerText').textContent = '✅ You\'ve spent enough time reading!';
                checkTopicCompletion();
                showToast('⏱️ Reading time complete! Now check the concepts below.', 'success');
            }
        }, 1000);
    }

    function updateTimerDisplay(secs) {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        const el = document.getElementById('timerCountdown');
        if (el) el.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    // =======================================
    //  CONCEPT CHECKBOXES
    // =======================================
    function onConceptCheck() {
        const checkboxes = document.querySelectorAll('.concept-cb');
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        const state = getState(currentLang, currentTopic);

        checkboxes.forEach(cb => {
            const item = cb.closest('.concept-item');
            if (cb.checked) item.classList.add('checked');
            else item.classList.remove('checked');
        });

        state.conceptsChecked = allChecked;
        if (allChecked) {
            showToast('✅ All concepts checked! Now pass the quiz below.', 'success');
        }
        checkTopicCompletion();
    }

    // =======================================
    //  GATE QUIZ
    // =======================================
    function checkGateAnswer(btn, optionIndex) {
        const topic = lessons[currentLang].topics[currentTopic];
        const correct = topic.gateQuiz.correct;
        const state = getState(currentLang, currentTopic);
        const options = document.querySelectorAll('.gate-option');
        const resultDiv = document.getElementById('gateResult');
        const unlockBtn = document.getElementById('unlockBtn');

        options.forEach((opt, i) => {
            opt.style.pointerEvents = 'none';
            if (i === correct) opt.classList.add('correct');
        });

        if (optionIndex === correct) {
            btn.classList.add('correct');
            resultDiv.innerHTML = `✅ Correct! ${topic.gateQuiz.explanation}`;
            resultDiv.className = 'gate-result success';
            state.quizPassed = true;
            checkTopicCompletion();
        } else {
            btn.classList.add('wrong');
            resultDiv.innerHTML = `❌ Not quite. ${topic.gateQuiz.explanation}`;
            resultDiv.className = 'gate-result failure';

            setTimeout(() => {
                options.forEach(opt => {
                    opt.classList.remove('correct', 'wrong');
                    opt.style.pointerEvents = 'auto';
                });
                resultDiv.style.display = 'none';
            }, 3000);
        }
        resultDiv.style.display = 'block';
    }

    // =======================================
    //  TOPIC COMPLETION
    // =======================================
    function checkTopicCompletion() {
        const state = getState(currentLang, currentTopic);

        if (state.timerDone && state.conceptsChecked && state.quizPassed && !state.completed) {
            state.completed = true;
            const unlockBtn = document.getElementById('unlockBtn');
            if (unlockBtn) unlockBtn.style.display = 'inline-block';
            showToast('🎉 Topic completed! You can now move to the next topic!', 'success');
            updateProgress();
            renderTopicNav();
        }
    }

    function unlockNext() {
        const topics = lessons[currentLang].topics;
        if (currentTopic < topics.length - 1) {
            selectTopic(currentTopic + 1);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            showToast('🏆 You\'ve completed all topics in ' + lessons[currentLang].name + '!', 'success');
        }
    }

    // =======================================
    //  RENDER LESSON
    // =======================================
    function renderLesson() {
        const topic = lessons[currentLang].topics[currentTopic];
        const state = getState(currentLang, currentTopic);

        let html = '';

        // Reading Timer
        html += `<div class="reading-timer">
            <span class="timer-text" id="timerText">⏱️ Read carefully — minimum reading time:</span>
            <span class="timer-countdown" id="timerCountdown">${Math.floor(topic.readTime/60)}:${(topic.readTime%60).toString().padStart(2,'0')}</span>
        </div>`;

        // Lesson Content
        html += `<div class="lesson-card">${topic.content}</div>`;

        // Concept Checklist
        html += `<div class="concept-checklist">
            <h4>✅ I Understand These Concepts (check all before proceeding):</h4>`;
        topic.concepts.forEach((c, i) => {
            const checked = state.conceptsChecked ? 'checked' : '';
            const checkedClass = state.conceptsChecked ? 'checked' : '';
            html += `<div class="concept-item ${checkedClass}">
                <input type="checkbox" class="concept-cb" ${checked} onchange="onConceptCheck()">
                <span>${c}</span>
            </div>`;
        });
        html += `</div>`;

        // Gate Quiz
        html += `<div class="gate-quiz">
            <h3>🔓 Unlock Next Topic — Prove Your Understanding</h3>
            <p class="gate-subtitle">Answer correctly to unlock the next lesson</p>
            <p class="gate-question">${topic.gateQuiz.question}</p>`;
        topic.gateQuiz.options.forEach((opt, i) => {
            html += `<div class="gate-option" onclick="checkGateAnswer(this, ${i})">${opt}</div>`;
        });
        html += `<div class="gate-result" id="gateResult"></div>
            <button class="unlock-btn" id="unlockBtn" onclick="unlockNext()" ${state.completed ? 'style="display:inline-block"' : ''}>
                🚀 Go to Next Topic
            </button>
        </div>`;

        document.getElementById('lessonContent').innerHTML = html;
        document.getElementById('lessonContent').style.display = 'block';
        document.getElementById('practiceSection').style.display = 'none';
        document.getElementById('quizSection').style.display = 'none';

        // Start timer
        startReadingTimer(topic.readTime);

        // Restore state
        if (state.timerDone) {
            document.getElementById('timerCountdown').textContent = '✅ Done!';
            document.getElementById('timerCountdown').classList.add('timer-done');
            document.getElementById('timerText').textContent = '✅ You\'ve spent enough time reading!';
        }
    }

    // =======================================
    //  PRACTICE SECTION WITH SYNTAX HIGHLIGHTING
    // =======================================
    function showSection(section, navLink) {
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active-nav'));
        if (navLink) navLink.classList.add('active-nav');

        if (section === 'lessons') {
            renderLesson();
        } else if (section === 'practice') {
            document.getElementById('lessonContent').style.display = 'none';
            document.getElementById('quizSection').style.display = 'none';
            renderPractice();
            document.getElementById('practiceSection').style.display = 'block';
        } else if (section === 'quiz') {
            document.getElementById('lessonContent').style.display = 'none';
            document.getElementById('practiceSection').style.display = 'none';
            renderQuiz();
            document.getElementById('quizSection').style.display = 'block';
        }
    }

                <h3>✍️ Practice ${lang.name} — Try It Yourself!</h3>
                <p style="color: var(--text-secondary); margin-bottom: 15px; font-size:14px;">
                    ${isRunnable ? 'Write JavaScript code and click Run to see the output! The editor highlights your code as you type.' : `Write ${lang.name} code below. Syntax highlighting works as you type!`}
                </p>

                <div class="editor-wrapper">
                    <div class="editor-header">
                        <div class="editor-dots">
                            <div class="editor-dot dot-red"></div>
                            <div class="editor-dot dot-yellow"></div>
                            <div class="editor-dot dot-green"></div>
                        </div>
                        <span class="editor-lang">${lang.icon} ${lang.name}</span>
                    </div>
                    <div class="editor-container" style="background: #0d0d1a;">
                        <div class="syntax-highlight" id="syntaxHighlight"></div>
                        <textarea class="code-editor" id="codeEditor"
                            placeholder="Type your code here..."
                            oninput="highlightSyntax()"
                            onscroll="syncScroll()"
                            spellcheck="false"></textarea>
                    </div>
                    <div class="editor-footer">
                        <span class="char-count" id="charCount">0 characters</span>
                        <div class="btn-group">
                            <button class="clear-btn" onclick="clearEditor()">🗑️ Clear</button>
                            <button class="run-btn" onclick="runCode()">▶ Run Code</button>
                        </div>
                    </div>
                </div>

                <div class="practice-output" id="practiceOutput">Output will appear here...</div>

                <h3 style="margin-top:25px; color: var(--accent-gold);">🎯 Challenges — Try These!</h3>
                ${challenges}
            </div>`;
    }

    // =======================================
    //  SYNTAX HIGHLIGHTING ENGINE
    // =======================================
    function highlightSyntax() {
        const editor = document.getElementById('codeEditor');
        const highlight = document.getElementById('syntaxHighlight');
        const charCount = document.getElementById('charCount');
        const code = editor.value;

        charCount.textContent = code.length + ' characters';
        highlight.innerHTML = applySyntaxHighlighting(code, currentLang);
    }

    function syncScroll() {
        const editor = document.getElementById('codeEditor');
        const highlight = document.getElementById('syntaxHighlight');
        highlight.scrollTop = editor.scrollTop;
        highlight.scrollLeft = editor.scrollLeft;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function applySyntaxHighlighting(code, lang) {
        let escaped = escapeHtml(code);

        // Common patterns
        const rules = {
            python: [
                // Comments
                [/(#.*)/gm, '<span class="sh-comment">$1</span>'],
                // Strings (double and single quotes)
                [/(&quot;.*?&quot;|".*?")/g, '<span class="sh-string">$1</span>'],
                [/('.*?')/g, '<span class="sh-string">$1</span>'],
                // Keywords
                [/\b(def|return|if|elif|else|for|while|in|import|from|class|try|except|finally|with|as|lambda|pass|break|continue|and|or|not|is|True|False|None|global|nonlocal|yield|raise|del|assert)\b/g, '<span class="sh-keyword">$1</span>'],
                // Built-in functions
                [/\b(print|input|range|len|type|int|str|float|bool|list|dict|set|tuple|abs|max|min|sum|sorted|reversed|enumerate|zip|map|filter|open|round)\b/g, '<span class="sh-function">$1</span>'],
                // Numbers
                [/\b(\d+\.?\d*)\b/g, '<span class="sh-number">$1</span>'],
                // Brackets
                [/([()[\]{}])/g, '<span class="sh-bracket">$1</span>'],
            ],
            javascript: [
                // Comments
                [/(\/\/.*)/gm, '<span class="sh-comment">$1</span>'],
                // Strings
                [/(&quot;.*?&quot;|".*?")/g, '<span class="sh-string">$1</span>'],
                [/('.*?')/g, '<span class="sh-string">$1</span>'],
                [/(`.*?`)/gs, '<span class="sh-string">$1</span>'],
                // Keywords
                [/\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|class|new|this|typeof|instanceof|try|catch|finally|throw|import|export|default|async|await|of|in|true|false|null|undefined)\b/g, '<span class="sh-keyword">$1</span>'],
                // Functions
                [/\b(console|log|alert|prompt|parseInt|parseFloat|Math|Array|Object|String|Number|JSON|document|window|setTimeout|setInterval)\b/g, '<span class="sh-function">$1</span>'],
                // Arrow
                [/(=&gt;)/g, '<span class="sh-operator">$1</span>'],
                // Numbers
                [/\b(\d+\.?\d*)\b/g, '<span class="sh-number">$1</span>'],
                [/([()[\]{}])/g, '<span class="sh-bracket">$1</span>'],
            ],
            java: [
                [/(\/\/.*)/gm, '<span class="sh-comment">$1</span>'],
                [/(&quot;.*?&quot;|".*?")/g, '<span class="sh-string">$1</span>'],
                [/('.*?')/g, '<span class="sh-string">$1</span>'],
                [/\b(public|private|protected|static|void|class|new|return|if|else|for|while|do|switch|case|break|continue|try|catch|finally|throw|throws|import|package|extends|implements|interface|abstract|final|this|super|true|false|null)\b/g, '<span class="sh-keyword">$1</span>'],
                [/\b(int|double|float|char|boolean|String|long|short|byte)\b/g, '<span class="sh-attr">$1</span>'],
                [/\b(System|out|println|print|Scanner|Math|Arrays)\b/g, '<span class="sh-function">$1</span>'],
                [/\b(\d+\.?\d*)\b/g, '<span class="sh-number">$1</span>'],
                [/([()[\]{}])/g, '<span class="sh-bracket">$1</span>'],
            ],
            c: [
                [/(\/\/.*)/gm, '<span class="sh-comment">$1</span>'],
                [/(&quot;.*?&quot;|".*?")/g, '<span class="sh-string">$1</span>'],
                [/('.*?')/g, '<span class="sh-string">$1</span>'],
                [/(#\w+)/g, '<span class="sh-keyword">$1</span>'],
                [/(&lt;\w+\.?\w*&gt;)/g, '<span class="sh-string">$1</span>'],
                [/\b(int|float|double|char|void|long|short|unsigned|signed|return|if|else|for|while|do|switch|case|break|continue|struct|typedef|sizeof|const|static|extern|enum|union|volatile|register|auto|goto|default)\b/g, '<span class="sh-keyword">$1</span>'],
                [/\b(printf|scanf|main|malloc|free|strlen|strcpy|strcmp|sizeof|fopen|fclose)\b/g, '<span class="sh-function">$1</span>'],
                [/\b(\d+\.?\d*)\b/g, '<span class="sh-number">$1</span>'],
                [/([()[\]{}])/g, '<span class="sh-bracket">$1</span>'],
            ],
            html: [
                [/(&lt;!--.*?--&gt;)/gs, '<span class="sh-comment">$1</span>'],
                [/(&lt;\/?)([\w]+)(.*?)(\/?\s*&gt;)/g, '$1<span class="sh-tag">$2</span>$3$4'],
                [/(\w+)(=)/g, '<span class="sh-attr">$1</span><span class="sh-operator">$2</span>'],
                [/(&quot;.*?&quot;|".*?")/g, '<span class="sh-string">$1</span>'],
                [/\b(color|background|padding|margin|border|font-size|display|flex|grid|width|height|text-align|border-radius|position)\b/g, '<span class="sh-keyword">$1</span>'],
                [/([{}:;])/g, '<span class="sh-operator">$1</span>'],
            ]
        };

        const langRules = rules[lang] || rules.python;
        langRules.forEach(([regex, replacement]) => {
            escaped = escaped.replace(regex, replacement);
        });

        return escaped + '\n';
    }

    function clearEditor() {
        document.getElementById('codeEditor').value = '';
        document.getElementById('syntaxHighlight').innerHTML = '';
        document.getElementById('charCount').textContent = '0 characters';
        document.getElementById('practiceOutput').textContent = 'Output will appear here...';
        document.getElementById('practiceOutput').className = 'practice-output';
    }

    // =======================================
    //  CODE RUNNER
    // =======================================
    function runCode() {
        const code = document.getElementById('codeEditor').value;
        const output = document.getElementById('practiceOutput');

        if (!code.trim()) {
            output.textContent = '⚠️ Please write some code first!';
            output.className = 'practice-output error-output';
            return;
        }

        if (currentLang === 'javascript') {
            try {
                let results = [];
                const origLog = console.log;
                const origWarn = console.warn;
                const origError = console.error;

                console.log = function(...args) { results.push(args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ')); };
                console.warn = function(...args) { results.push('⚠️ ' + args.join(' ')); };
                console.error = function(...args) { results.push('❌ ' + args.join(' ')); };

                const returnVal = eval(code);

                console.log = origLog;
                console.warn = origWarn;
                console.error = origError;

                if (results.length > 0) {
                    output.textContent = results.join('\n');
                } else if (returnVal !== undefined) {
                    output.textContent = String(returnVal);
                } else {
                    output.textContent = '✅ Code executed successfully (no console output).\nTip: Use console.log() to see output!';
                }
                output.className = 'practice-output';
                showToast('✅ Code executed successfully!', 'success');
            } catch (error) {
                output.textContent = '❌ Error: ' + error.message + '\n\n💡 Check your code for typos!';
                output.className = 'practice-output error-output';
                showToast('❌ Code has an error — check the output', 'error');
            }
        } else if (currentLang === 'html') {
            try {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
                iframe.contentDocument.open();
                iframe.contentDocument.write(code);
                iframe.contentDocument.close();
                const text = iframe.contentDocument.body.innerText || iframe.contentDocument.body.textContent;
                document.body.removeChild(iframe);
                output.textContent = text ? '📄 Rendered text content:\n\n' + text : '✅ HTML rendered (open browser console with F12 to see full result)';
                output.className = 'practice-output';
            } catch(e) {
                output.textContent = '❌ Error: ' + e.message;
                output.className = 'practice-output error-output';
            }
        } else {
            // Simulate output for non-browser languages
            let simulated = simulateOutput(code, currentLang);
            output.textContent = simulated;
            output.className = 'practice-output';
        }
    }

    function simulateOutput(code, lang) {
        let outputs = [];

        if (lang === 'python') {
            const printRegex = /print\s*\(\s*(.*?)\s*\)/g;
            let match;
            while ((match = printRegex.exec(code)) !== null) {
                let arg = match[1];
                // Handle strings
                arg = arg.replace(/["']/g, '');
                // Handle comma separated
                arg = arg.replace(/\s*,\s*/g, ' ');
                outputs.push(arg);
            }
            if (outputs.length === 0) {
                return 'ℹ️ Python runs on your computer, not in the browser.\n\n🔧 To run Python:\n• Use Replit.com (free, online)\n• Use OnlineGDB.com\n• Install Python + VS Code\n\n💡 But I detected your code! If it has print() statements, I\'ll show simulated output.\n\n🔄 Switch to JavaScript for live execution here!';
            }
            return '🐍 Simulated Python Output:\n\n' + outputs.join('\n') + '\n\n(For accurate output, use Replit.com)';
        } else if (lang === 'java') {
            const printRegex = /System\.out\.println\s*\(\s*(.*?)\s*\)/g;
            let match;
            while ((match = printRegex.exec(code)) !== null) {
                let arg = match[1].replace(/["']/g, '');
                outputs.push(arg);
            }
            if (outputs.length === 0) {
                return 'ℹ️ Java needs a compiler.\n\n🔧 Use: Replit.com, OnlineGDB.com, or install JDK\n🔄 Switch to JavaScript for live execution!';
            }
            return '☕ Simulated Java Output:\n\n' + outputs.join('\n');
        } else if (lang === 'c') {
            const printRegex = /printf\s*\(\s*"(.*?)"/g;
            let match;
            while ((match = printRegex.exec(code)) !== null) {
                let arg = match[1].replace(/\\n/g, '\n');
                outputs.push(arg);
            }
            if (outputs.length === 0) {
                return 'ℹ️ C needs a compiler.\n\n🔧 Use: Replit.com, OnlineGDB.com, or install GCC\n🔄 Switch to JavaScript for live execution!';
            }
            return '⚙️ Simulated C Output:\n\n' + outputs.join('');
        }

        return 'Switch to JavaScript for live code execution!';
    }

    // =======================================
    //  QUIZ SECTION
    // =======================================
    function renderQuiz() {
        const quizData = lessons[currentLang].quiz;
        const langName = lessons[currentLang].name;

        if (!quizData || quizData.length === 0) {
            document.getElementById('quizSection').innerHTML = '<div class="lesson-card"><h2>Quiz coming soon!</h2></div>';
            return;
        }

        let html = `<div class="quiz-section">
            <h3>🧠 ${langName} Final Quiz — Test Everything You Learned!</h3>
            <p style="color:var(--text-secondary);font-size:13px;margin-bottom:15px;">Answer all questions. Your score is shown at the end.</p>`;

        quizData.forEach((q, qi) => {
            html += `<div class="quiz-question-block">
                <p>${qi + 1}. ${q.question}</p>`;
            q.options.forEach((opt, oi) => {
                html += `<div class="quiz-option" onclick="checkQuizAnswer(this, ${qi}, ${oi})">${opt}</div>`;
            });
            html += `<div class="quiz-result" id="qresult-${qi}"></div></div>`;
        });

        html += `<div class="score-display" id="scoreDisplay"><h2 id="scoreText"></h2><p id="scoreMsg"></p></div></div>`;
        document.getElementById('quizSection').innerHTML = html;
        window.quizScore = 0;
        window.quizAnswered = 0;
    }

    function checkQuizAnswer(el, qi, oi) {
        const quizData = lessons[currentLang].quiz;
        const correct = quizData[qi].correct;
        const result = document.getElementById(`qresult-${qi}`);
        const options = el.parentElement.querySelectorAll('.quiz-option');

        options.forEach((opt, i) => {
            opt.style.pointerEvents = 'none';
            if (i === correct) opt.classList.add('correct');
        });

        if (oi === correct) {
            el.classList.add('correct');
            result.textContent = '✅ Correct!';
            result.style.color = 'var(--accent-green)';
            window.quizScore++;
        } else {
            el.classList.add('wrong');
            result.textContent = '❌ Wrong — correct answer highlighted in green';
            result.style.color = 'var(--accent-red)';
        }
        result.style.display = 'block';
        window.quizAnswered++;

        if (window.quizAnswered === quizData.length) {
            const scoreDisplay = document.getElementById('scoreDisplay');
            const pct = Math.round((window.quizScore / quizData.length) * 100);
            document.getElementById('scoreText').textContent = `Score: ${window.quizScore}/${quizData.length} (${pct}%)`;
            document.getElementById('scoreMsg').textContent = pct >= 80 ? '🎉 Excellent, Samuel! You really learned this!' : pct >= 60 ? '👍 Good job! Review the topics you missed.' : '📚 Keep studying! Review the lessons and try again.';
            document.getElementById('scoreMsg').style.color = 'var(--text-secondary)';
            document.getElementById('scoreMsg').style.marginTop = '10px';
            scoreDisplay.style.display = 'block';
        }
    }

    // =======================================
    //  UTILITY
    // =======================================
    function copyCode(btn) {
        const codeBlock = btn.nextElementSibling;
        navigator.clipboard.writeText(codeBlock.innerText).then(() => {
            btn.textContent = '✅ Copied!';
            setTimeout(() => { btn.textContent = '📋 Copy'; }, 2000);
        });
    }

    // =======================================
    //  INITIALIZE
    // =======================================
    renderTopicNav();
    renderLesson();
    updateProgress();
    </script>
